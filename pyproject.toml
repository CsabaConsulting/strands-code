[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-code-agent"
version = "0.4.0"
description = "A coding agent built on Strands Agents SDK that uses code generation as the primary action interface"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.10"
authors = [
    { name = "Emilio Monti" },
]
keywords = ["agents", "code-generation", "llm", "strands", "repl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "strands-agents>=0.1.0",
    "strands-harness>=0.1",
    "smolagents>=1.0.0",
    "jinja2>=3.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "typer>=0.27.2",
    "prompt-toolkit>=3.0.53",
    "platformdirs>=4.11.12",
]

[project.optional-dependencies]
agentcore = ["boto3>=1.35.0"]

[project.scripts]
strands-code = "strands_code_cli.main:main"

[dependency-groups]
# Test-only runtime needs: toolkit wiring tests execute real numpy/pandas
# plotting code, so a bare install shows 4 failures without these.
dev = [
    "pytest>=8",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/aws-samples/sample-strands-code-agent"
Repository = "https://github.com/aws-samples/sample-strands-code-agent"
Issues = "https://github.com/aws-samples/sample-strands-code-agent/issues"

[tool.pytest.ini_options]
markers = [
    "integration: live integration tests requiring AWS credentials (deselected by default)",
]
addopts = "-m 'not integration'"
