# Dependabot watches PyPI for our deps (notably strands-agents / strands-harness
# from the strands-agents/harness-sdk monorepo) and opens review-gated bump PRs.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv" # uv-managed pyproject.toml + uv.lock
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep pyproject.toml lower bounds aligned with upstream sample-strands-code-agent;
    # update uv.lock only unless a floor bump is required for a CVE.
    versioning-strategy: lockfile-only
    # Wait for newly published PyPI wheels to age past supply-chain detection windows;
    # verified CVE security updates still bypass cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
